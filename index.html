<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Социальные сети, Музыка и Игры</title>

<!-- Подключение иконок FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #06060c; 
    color: white;
    overflow-x: hidden;
    position: relative;
    padding: 40px 20px;
}

/* Фон с интерактивными частицами */
#bg-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none; 
}

/* Общая обертка для трех колонок */
.main-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: row;
    gap: 25px;
    max-width: 1400px;
    width: 100%;
    justify-content: center;
    align-items: flex-start;
}

/* Базовые стили для карточек-контейнеров */
.container {
    width: 100%;
    max-width: 400px;
    height: 700px;
    text-align: center;
    background: rgba(10, 10, 20, 0.35);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 40px; 
    box-shadow: 0 35px 70px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
    padding: 40px 35px;
    display: flex;
    flex-direction: column;
}

.container:hover {
    transform: translateY(-5px);
    box-shadow: 0 45px 90px rgba(0, 0, 0, 0.65), 0 0 50px rgba(88, 101, 242, 0.08), 0 0 70px rgba(255, 0, 170, 0.03);
}

/* Иконки сверху (Музыка / Джойстик) */
.icon-box {
    font-size: 50px;
    margin-bottom: 5px;
    animation: floatAnim 3s ease-in-out infinite alternate;
}

.music-icon {
    color: #1DB954;
    text-shadow: 0 0 20px rgba(29, 185, 84, 0.5);
}

.game-icon {
    color: #4facfe;
    text-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
}

@keyframes floatAnim {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
}

/* Заголовки */
h2 {
    color: #aeb4e6;
    font-size: 15px; 
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    opacity: 0.8;
    margin-bottom: 25px;
}

/* Общие списки элементов */
.links, .music-list, .games-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
}

/* --- КАРТОЧКА 2: ПРОФИЛЬ И СОЦСЕТИ --- */
.avatar-box {
    position: relative;
    width: 150px; 
    height: 150px; 
    margin: 0 auto 28px;
}

.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    z-index: 2;
}

.avatar-box::after {
    content: '';
    position: absolute;
    top: -5px; left: -5px; right: -5px; bottom: -5px;
    border-radius: 50%;
    background: linear-gradient(45deg, #5865F2, #ff00aa, #00f2fe);
    background-size: 200% 200%;
    z-index: 1;
    opacity: 0.5;
    filter: blur(10px);
    transition: all 0.4s ease;
    animation: gradientShift 4s linear infinite;
}

.avatar-box:hover .avatar {
    transform: scale(1.08) rotate(5deg);
    border-color: #5865F2;
}

.avatar-box:hover::after { opacity: 0.9; filter: blur(16px); transform: scale(1.05); }

/* Ссылки соцсетей */
.links a {
    text-decoration: none;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 18px 24px; 
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center; 
    position: relative;
    overflow: hidden;
    font-size: 17px; 
    font-weight: 600;
    letter-spacing: 0.5px;
    backdrop-filter: blur(5px);
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.links a i { font-size: 26px; margin-right: 12px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.links a::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}
.links a:hover::before { left: 100%; }
.links a:hover { transform: translateY(-4px); color: #fff; }
.links a:hover i { transform: scale(1.2) rotate(-5deg); }

.telegram:hover { background: linear-gradient(135deg, #229ED9, #1e8ec3); border-color: #229ED9; box-shadow: 0 12px 30px rgba(34, 158, 217, 0.45); }
.discord:hover { background: linear-gradient(135deg, #5865F2, #4752c4); border-color: #5865F2; box-shadow: 0 12px 30px rgba(88, 101, 242, 0.45); }
.steam:hover { background: linear-gradient(135deg, #171a21, #2a475e); border-color: #66c0f4; box-shadow: 0 12px 30px rgba(102, 192, 244, 0.35); }
.spotify:hover { background: linear-gradient(135deg, #1DB954, #1aa34a); border-color: #1DB954; box-shadow: 0 12px 30px rgba(29, 185, 84, 0.45); }


/* --- ОБЩАЯ СТРУКТУРА ДЛЯ ИГР И МУЗЫКИ --- */
.item-card {
    position: relative;
    height: 68px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(10, 10, 15, 0.4);
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 2px 10px rgba(0,0,0,1);
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: pointer;
    gap: 10px;
    text-decoration: none;
}

.item-card:is(a) {
    text-decoration: none;
    color: inherit;
}

.item-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0.25; 
    filter: blur(0.5px) grayscale(15%);
    z-index: 1;
    transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    border-radius: 20px;
}

.item-title {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.item-title i {
    font-size: 16px;
    opacity: 0.9;
    transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), color 0.3s ease;
}


/* --- МУЗЫКАЛЬНЫЕ СТИЛИ (SPOTIFY STYLE) --- */
.music-list{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.music-card{
    position:relative;
    height:90px;
    border-radius:24px;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    padding:18px;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.08);
    background:#121212;
    transition:.4s;
}

.music-card .item-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:.8;
    filter:brightness(.45);
    transition:.5s;
}

.music-card::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.9),
        rgba(0,0,0,.3),

    z-index:1;
}

.music-card .item-title{

    z-index:2;
    font-size:18px;
    font-weight:700;

}

.music-card .item-title i{

    margin-right:8px;
}

.music-card:hover{

    border-color:#1DB954;
    box-shadow:
        0 15px 40px rgba(29,185,84,.25),

}

.music-card:hover .item-bg{

    filter:brightness(.7);
}

/* --- ИГРОВЫЕ ХОВЕР-АНИМАЦИИ --- */

.valorant-special:hover .item-title { animation: valorantGlitch 0.3s linear infinite alternate; }

.tanks-card:hover .item-title i { transform: scale(1.3); color: #ff7700; }

.ets-card:hover { transform: translateY(-3px) scale(1.02); }
.ets-card:hover .item-bg { transform: scale(1.15) translateY(10px); }

.gta-card:hover {

}
.gta-card:hover .item-bg { transform: scale(1.15) translateY(-5px); }
.gta-card:hover .item-title i { transform: scale(1.2); color: #22b14c; }


/* Анимации и тайминги */
@keyframes valorantGlitch {
    0% { transform: skewX(-1.5deg); text-shadow: 2px 0 0 rgba(255,70,85,0.6); }
    50% { transform: skewX(1.5deg); text-shadow: -2px 0 0 rgba(0,242,254,0.5); }
    100% { transform: skewX(0deg); text-shadow: 1px 0 0 rgba(255,70,85,0.6); }
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Адаптивность под планшеты и мобилки */
@media (max-width: 1200px) {

    .container { max-width: 45%; }
}
@media (max-width: 820px) {
    .main-wrapper { flex-direction: column; align-items: center; }
    .container { max-width: 500px; }
}
</style>

<!-- Скрипт интерактивного заднего фона -->
<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

let particles = [];
const particleCount = 75; 
const maxDistance = 140;  

const mouse = { x: null, y: null, radius: 180 };

window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();
}

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        this.radius = Math.random() * 2.5 + 1;
        this.color = Math.random() > 0.5 ? 'rgba(88, 101, 242, ' : 'rgba(255, 0, 170, ';
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color + '0.7)';
        ctx.fill();
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        if (mouse.x !== null && mouse.y !== null) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouse.radius) {
                let force = (mouse.radius - dist) / mouse.radius;
                this.x -= (dx / dist) * force * 0.8;
                this.y -= (dy / dist) * force * 0.8;
            }
        }
        this.draw();
    }
}

function initParticles() {
    particles = [];
    for (let i = 0; i < particleCount; i++) { particles.push(new Particle()); }
}

function connectParticles() {
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < maxDistance) {
                let opacity = (1 - (distance / maxDistance)) * 0.22;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                let gradient = ctx.createLinearGradient(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
                gradient.addColorStop(0, `rgba(88, 101, 242, ${opacity})`);
                gradient.addColorStop(1, `rgba(255, 0, 170, ${opacity})`);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }
        }
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => p.update());
    connectParticles();
    requestAnimationFrame(animate);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
animate();
</script>
